services:
  terminal:
    image: ${ALLINONE_IMAGE:?Set ALLINONE_IMAGE to the built release tag}
    container_name: allinone-terminal
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    environment:
      GCT_HOST: 127.0.0.1
      GCT_PORT: "17840"
      GCT_FRONTEND_PORT: "17840"
      GCT_ALLOWED_HOSTS: ${ALLINONE_HOST:?Set ALLINONE_HOST}
      GCT_FRONTEND_ORIGIN: https://${ALLINONE_HOST}
      GCT_DATA_DIR: /data
      GCT_CREDENTIAL_ENV_PATH: /data/credentials.env
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:17840/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
